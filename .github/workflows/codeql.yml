# CodeQL static analysis for JavaScript/TypeScript.
# Note: if GitHub default CodeQL setup is enabled on the repo, advanced workflow
# SARIF upload may warn. Build still runs so analysis has compiled sources.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build for analysis
        run: |
          npm install --no-fund --no-audit
          cd gas-oracle-mcp && npm install --legacy-peer-deps --no-fund --no-audit && npm run build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: "/language:${{ matrix.language }}"
