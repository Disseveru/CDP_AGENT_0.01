# Primary CI runs on GitHub Actions for every push/PR to main.
# Local / Cursor agents can also run: npm run ci
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Run CI
        run: npm run ci
