# npm dependency audit — root CLI + AgentWire MCP.
# Fail only on critical findings. High/moderate from deep agentkit/web3 trees are
# reported but do not block merge (breaking upgrades require a dedicated PR).
#
# Use `npm install` (not `npm ci`) so package.json overrides can resolve without
# requiring a lockfile rewrite on every transitive pin.
name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Audit root dependencies (critical)
        run: |
          npm install --no-fund --no-audit
          npm audit --audit-level=critical

      - name: Report root high/moderate (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high || true

      - name: Audit AgentWire dependencies (critical)
        working-directory: gas-oracle-mcp
        run: |
          npm install --legacy-peer-deps --no-fund --no-audit
          npm audit --audit-level=critical

      - name: Report AgentWire high/moderate (non-blocking)
        working-directory: gas-oracle-mcp
        continue-on-error: true
        run: npm audit --audit-level=high || true
